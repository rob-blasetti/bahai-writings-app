name: iOS TestFlight (Bahai Writings)

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane lane to run"
        required: false
        default: "beta"
  push:
    branches:
      - main
    tags:
      - "v*"
    # Only run on main pushes when the app/build-related files change.
    # Tag pushes always run.
    paths:
      - "ios/**"
      - "src/**"
      - "package.json"
      - "yarn.lock"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Set up SSH for match signing repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SIGNING_REPO_SSH_KEY }}

      - name: Create App Store Connect key file
        run: |
          mkdir -p $RUNNER_TEMP/asc
          echo "${ASC_KEY_P8}" > $RUNNER_TEMP/asc/AuthKey.p8
          echo "ASC_KEY_FILE=$RUNNER_TEMP/asc/AuthKey.p8" >> $GITHUB_ENV
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

      - name: Install Pods
        working-directory: ios
        run: bundle exec pod install

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          API_URL: ${{ secrets.API_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_LANE: ${{ github.event.inputs.lane || 'beta' }}
        run: bundle exec fastlane ios "$FASTLANE_LANE"
